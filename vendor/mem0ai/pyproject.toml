[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mem0ai"
version = "2.0.12+workspace.1"
description = "Vendored mem0ai with workspace-local modifications (see README)."
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.28.0",
  "openai>=1.90.0",
  "posthog>=7.14.0",
  "protobuf<7.0.0,>=5.29.6",
  "pydantic>=2.7.3",
  "pytz>=2024.1",
  "qdrant-client>=1.12.0",
  "sqlalchemy>=2.0.31",
]

[tool.setuptools.packages.find]
include = ["mem0*"]
