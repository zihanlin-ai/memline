[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mem0-local"
version = "0.2.0"
description = "Local-first Mem0 CLI with Qdrant path storage and audit metadata."
readme = "README.md"
requires-python = ">=3.11"
# NOTE: mem0ai is intentionally NOT listed here. This package requires the
# vendored build in ./vendor/mem0ai (2.0.x+workspace.N); the official PyPI
# package imports but breaks at runtime. Install the vendored package first
# (see README); runtime.check_vendored_mem0() fails fast otherwise.
dependencies = [
  "click",
  "fastembed",
  "python-dotenv",
  "pyyaml",
  "qdrant-client",
  "rich",
  "typer",
]

[project.scripts]
mem0-local = "mem0_local.cli:cli_main"
mem0-local-ingest-ledger = "mem0_local.ingest_ledger:main"
mem0-local-backfill-metadata = "mem0_local.backfill_metadata:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
