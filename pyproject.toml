[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memline"
version = "0.2.0"
description = "Local-first Mem0 CLI with Qdrant path storage and audit metadata."
readme = "README.md"
requires-python = ">=3.11"
# NOTE: mem0ai is intentionally NOT listed here. This package requires the
# vendored build in ./vendor/mem0ai (2.0.x+workspace.N); the official PyPI
# package imports but breaks at runtime. Install the vendored package first
# (see README); runtime.check_vendored_mem0() fails fast otherwise.
dependencies = [
  "click",
  "fastembed",
  # Imported directly by memline.proxy, which assembles the
  # CONNECT-tunnelling transport for plain-HTTP endpoints from httpcore's
  # connection classes. Both also arrive with openai; named here because this
  # package uses them in its own right.
  "httpcore",
  "httpx",
  "python-dotenv",
  "pyyaml",
  "qdrant-client",
  "rich",
  "typer",
]

[project.scripts]
memline = "memline.cli:cli_main"
memline-ingest-ledger = "memline.ingest_ledger:main"
memline-backfill-metadata = "memline.backfill_metadata:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Prompts are part of the program: the schema a caller parses is defined by
# the prompt that asked for it, so they ship together.
memline = ["prompts/*.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
